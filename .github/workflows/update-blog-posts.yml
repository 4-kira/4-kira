name: Update Latest Blog Posts

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST (UTC+9 → UTC 15:00)
  workflow_dispatch: # 수동 트리거

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README with latest posts
        run: python scripts/update_blog_posts.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update latest blog posts"
          git push
